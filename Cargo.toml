[package]
name = "metis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust presentation and isolated backend process contract"

[workspace]
resolver = "3"
members = [
    ".",
    "crates/metis-core",
    "crates/metis-backend",
    "crates/metis-frontend",
    "crates/metis-ipc",
    "crates/metis-ui-lang",
    "crates/metis-platform",
    "crates/metis-cli",
    "crates/metis-app",
    "crates/metis-web",
    "crates/metis-python",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/metis"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
iris = { package = "iris-viz", git = "https://github.com/ryancinsight/iris", version = "0.1" }
moirai-core = { git = "https://github.com/ryancinsight/Moirai.git", rev = "5c8a9e8b", version = "0.6", default-features = false, features = ["std"] }
moirai-executor = { git = "https://github.com/ryancinsight/Moirai.git", rev = "5c8a9e8b", version = "0.6", default-features = false }
moirai-transport = { git = "https://github.com/ryancinsight/Moirai.git", rev = "5c8a9e8b", version = "0.6", default-features = false }
moirai-pal = { git = "https://github.com/ryancinsight/Moirai.git", rev = "5c8a9e8b", version = "0.6", default-features = false }
moirai-crypto = { git = "https://github.com/ryancinsight/Moirai.git", rev = "5c8a9e8b", version = "0.6", default-features = false }
moirai-async = { git = "https://github.com/ryancinsight/Moirai.git", rev = "5c8a9e8b", version = "0.6", default-features = false }
moirai-http = { git = "https://github.com/ryancinsight/Moirai.git", rev = "5c8a9e8b", version = "0.6", default-features = false }
metis-core = { path = "crates/metis-core", version = "0.1.0" }
metis-ipc = { path = "crates/metis-ipc", version = "0.1.0" }
metis-ui-lang = { path = "crates/metis-ui-lang", version = "0.1.0" }
metis-platform = { path = "crates/metis-platform", version = "0.1.0" }
metis-backend = { path = "crates/metis-backend", version = "0.1.0" }
metis-frontend = { path = "crates/metis-frontend", version = "0.1.0" }
metis-web = { path = "crates/metis-web", version = "0.1.0" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39"] }

[dev-dependencies]
iris.workspace = true
moirai-core.workspace = true
moirai-executor.workspace = true
moirai-crypto.workspace = true
metis-core = { workspace = true }
metis-ipc = { workspace = true }
metis-ui-lang = { workspace = true }
metis-platform = { workspace = true }
metis-backend = { workspace = true }
metis-frontend = { workspace = true }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"

[lints]
workspace = true

[profile.dev]
debug = "line-tables-only"
overflow-checks = true

[profile.test]
debug = "line-tables-only"
overflow-checks = true

[profile.release]
debug = false
strip = "symbols"
overflow-checks = true
