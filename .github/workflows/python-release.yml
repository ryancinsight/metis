name: Python Release

# Build and publish the PyO3 package without a long-lived PyPI token or a
# developer signing key. PyPI Trusted Publishing exchanges this job's OIDC
# identity for a short-lived upload credential.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.tag_name || format('verification-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  wheels:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'metis-python-v')
    name: Build and validate Python distributions
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    uses: ryancinsight/atlas/.github/workflows/python-wheels.yml@f747b8b4de9fb39dfdbe3d3731f0020bc04a947d
    with:
      distribution: metis-rs
      import-name: metis
      manifest-path: crates/metis-python/Cargo.toml
      atlas-ref: f747b8b4de9fb39dfdbe3d3731f0020bc04a947d
      tag-prefix: metis-python-v
      abi3: true
      abi3-python: "3.9"
      python-test-path: crates/metis-python/tests
      free-threaded: true
      free-threaded-versions: '["3.14t", "3.15t"]'
      abi3t: true
      abi3t-python: "3.15t"
      abi3t-features: abi3t
      verification: ${{ github.event_name == 'workflow_dispatch' }}

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'metis-python-v')
    name: Publish release distributions to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/metis-rs
    permissions:
      id-token: write
    steps:
      - name: Download validated release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheels
          path: dist

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          print-hash: true
