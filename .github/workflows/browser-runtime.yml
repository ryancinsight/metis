name: Metis browser runtime

on:
  workflow_call:
    inputs:
      engine:
        required: true
        type: string
      runner:
        required: true
        type: string
      driver_url:
        required: true
        type: string
      device_scale:
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime:
    name: Browser runtime (${{ inputs.engine }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Setup Rust for HTTP boundary
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - name: Download browser assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metis-browser-assets-${{ github.run_id }}
          path: output/browser
      - name: Build HTTP fragment service
        shell: bash
        run: cargo build --locked -p metis-app
      - name: Start virtual display
        if: inputs.engine != 'webkit'
        shell: bash
        run: |
          set -euo pipefail
          command -v Xvfb
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - name: Start Chromium WebDriver
        if: inputs.engine == 'chromium'
        shell: bash
        run: |
          set -euo pipefail
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
      - name: Start Firefox WebDriver
        if: inputs.engine == 'firefox'
        shell: bash
        run: |
          set -euo pipefail
          "$GECKOWEBDRIVER/geckodriver" --port=4444 --host 127.0.0.1 > "$RUNNER_TEMP/geckodriver.log" 2>&1 &
      - name: Enable Safari WebDriver
        if: inputs.engine == 'webkit'
        shell: bash
        run: sudo -n /usr/bin/safaridriver --enable
      - name: Start Safari WebDriver
        if: inputs.engine == 'webkit'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
      - name: Wait for WebDriver
        shell: bash
        env:
          DRIVER_URL: ${{ inputs.driver_url }}
        run: |
          set -euo pipefail
          python - "$DRIVER_URL" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          endpoint = sys.argv[1].rstrip("/") + "/status"
          deadline = time.monotonic() + 20.0
          last_error = "no response"
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(endpoint, timeout=1.0) as response:
                      if response.status != 200:
                          last_error = f"HTTP {response.status}"
                      else:
                          document = json.load(response)
                          value = document.get("value") if isinstance(document, dict) else None
                          if isinstance(value, dict) and value.get("ready") is not False:
                              raise SystemExit(0)
                          last_error = "driver status is not ready"
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as error:
                  last_error = str(error)
              time.sleep(0.1)
          raise SystemExit(f"WebDriver did not become ready within 20 seconds: {last_error}")
          PY
      - name: Run browser lifecycle trace
        shell: bash
        env:
          DRIVER_URL: ${{ inputs.driver_url }}
          ENGINE: ${{ inputs.engine }}
          DEVICE_SCALE: ${{ inputs.device_scale }}
        run: |
          set -euo pipefail
          python scripts/browser_runtime.py \
            --engine "$ENGINE" \
            --driver-url "$DRIVER_URL" \
            --serve-dir output/browser \
            --bridge disconnected \
            --device-scale "$DEVICE_SCALE" \
            --browser-heap-sample \
            --accessibility-probe \
            --asset-probe \
            --text-geometry-probe \
            --lifecycle-cycles 4 \
            --timeout-seconds 60 \
            --output "output/browser/runtime/$ENGINE-workbench.json"
      - name: Run authenticated fragment trace
        shell: bash
        env:
          DRIVER_URL: ${{ inputs.driver_url }}
          ENGINE: ${{ inputs.engine }}
          DEVICE_SCALE: ${{ inputs.device_scale }}
        run: |
          set -euo pipefail
          static_port_file="$RUNNER_TEMP/metis-http-port"
          rm -f "$static_port_file"
          python scripts/browser_static_server.py \
            --directory output/browser \
            --port-file "$static_port_file" \
            > "$RUNNER_TEMP/metis-http-static.log" 2>&1 &
          static_pid=$!
          service_pid=''
          cleanup() {
            status=$?
            if [[ -n "$service_pid" ]]; then
              kill "$service_pid" 2>/dev/null || true
              wait "$service_pid" 2>/dev/null || true
            fi
            kill "$static_pid" 2>/dev/null || true
            wait "$static_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in {1..200}; do
            if [[ -s "$static_port_file" ]]; then
              break
            fi
            if ! kill -0 "$static_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/metis-http-static.log"
              exit 1
            fi
            sleep 0.1
          done
          if [[ ! -s "$static_port_file" ]]; then
            echo 'HTTP static server did not publish a port within 20 seconds' >&2
            exit 1
          fi
          static_port="$(cat "$static_port_file")"
          origin="http://127.0.0.1:$static_port"
          target_binary="$(pwd)/target/debug/metis-app"
          "$target_binary" --metis-http-service "$origin" 8766 66666666666666666666666666666666 > "$RUNNER_TEMP/metis-http-service.log" 2>&1 &
          service_pid=$!
          python - "$service_pid" "$origin" <<'PY'
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          pid = int(sys.argv[1])
          origin = sys.argv[2]
          endpoint = "http://127.0.0.1:8766/health"
          deadline = time.monotonic() + 20.0
          last_error = "no response"
          while time.monotonic() < deadline:
              try:
                  os.kill(pid, 0)
              except OSError as error:
                  raise SystemExit(f"HTTP fragment service exited before readiness: {error}") from error
              try:
                  request = urllib.request.Request(endpoint, headers={"Origin": origin})
                  with urllib.request.urlopen(request, timeout=1.0) as response:
                      body = response.read().decode("utf-8")
                      if response.status == 200 and body == "metis-http-ready\n":
                          raise SystemExit(0)
                      last_error = f"HTTP {response.status}: {body!r}"
              except (OSError, urllib.error.URLError, UnicodeError) as error:
                  last_error = str(error)
              time.sleep(0.1)
          raise SystemExit(f"HTTP fragment service did not become ready within 20 seconds: {last_error}")
          PY
          python scripts/browser_runtime.py \
            --engine "$ENGINE" \
            --driver-url "$DRIVER_URL" \
            --scenario fragment \
            --url "$origin/http-health.html" \
            --device-scale "$DEVICE_SCALE" \
            --browser-heap-sample \
            --timeout-seconds 60 \
            --output "output/browser/runtime/$ENGINE-fragment.json"
      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-browser-runtime-${{ inputs.engine }}-${{ github.run_id }}
          path: output/browser/runtime
          if-no-files-found: ignore
          retention-days: 7
