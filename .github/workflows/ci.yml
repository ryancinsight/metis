name: Metis verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metis-verification-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    # merge_group and path filters are gone (a path-filtered required
    # workflow never starts, leaving its check pending forever); this job
    # replaces the path filter so the expensive jobs below still skip on
    # PM-only or docs-only changes. It does not run on schedule/dispatch,
    # where every downstream job keeps its own unconditional behavior.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tree: ${{ steps.tree.outputs.tree }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the checked-out tree
        # For pull_request this is refs/pull/<N>/merge: the tree that lands
        # if main does not move before merge. For push it is the pushed
        # commit's own tree.
        id: tree
        shell: bash
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Determine whether tracked paths changed
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              # New branch pushed with no prior commit to diff against: treat
              # as code changed rather than guess.
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="$before..${{ github.sha }}"
          fi
          pattern='^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.config/|crates/|src/|tests/|examples/|docs/|scripts/|metis\.json|backlog\.md|\.githooks/|\.github/workflows/)'
          if git diff --name-only "$range" | grep -Eq "$pattern"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for a prior verified run of this tree
        # Only a successful run of this workflow can authorize reusing a tree.
        if: github.event_name == 'push'
        id: verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def api(path, *arguments):
              response = subprocess.run(
                  ["gh", "api", path, *arguments], check=True,
                  capture_output=True, text=True, timeout=30,
              )
              return json.loads(response.stdout)

          repository = os.environ["GITHUB_REPOSITORY"]
          repository_id = int(os.environ["GITHUB_REPOSITORY_ID"])
          workflow = api(f"repos/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}")["workflow_id"]
          name = "verified-tree-" + os.environ["TREE"]
          pages = api(f"repos/{repository}/actions/artifacts", "--method", "GET",
                      "--field", f"name={name}", "--paginate", "--slurp")
          verified = False
          for page in pages:
              for artifact in page["artifacts"]:
                  if (artifact["name"] != name or artifact["expired"] or
                          artifact["workflow_run"]["head_repository_id"] != repository_id):
                      continue
                  run = api(f"repos/{repository}/actions/runs/{artifact['workflow_run']['id']}")
                  if (run["workflow_id"] == workflow and run["path"] == ".github/workflows/ci.yml" and
                          run["event"] == "pull_request" and run["status"] == "completed" and
                          run["conclusion"] == "success" and
                          run["head_repository"]["id"] == repository_id):
                      verified = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"verified={str(verified).lower()}\n")
          PY

  verify:
    name: Windows gate
    needs: changes
    if: >-
      always() &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.changes.outputs.code == 'true') ||
        (github.event_name == 'push' && needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true')
      )
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Python binding gate tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "maturin==1.14.1" "pytest==8.4.2"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Restore the compile cache (keyed on lockfile and toolchain)
        # The gate rebuilt every dependency from cold on Windows on each run,
        # nine to twelve minutes per pull request; the cache saves on the
        # default branch and restores everywhere (engineering_gates: workflow
        # hygiene).
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: metis-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prime locked Cargo sources
        shell: pwsh
        run: rustup run 1.97.0 cargo fetch --locked --manifest-path Cargo.toml
      - name: Install pinned gate tools
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: |
            cargo-nextest@0.9.143
            cargo-deny@0.20.2
            wasm-bindgen@0.2.128
          checksum: true
      - name: Prime advisory database
        shell: pwsh
        run: cargo-deny fetch db
      - name: Run the committed Metis gate
        shell: pwsh
        run: python scripts/verify.py --install
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-verification-${{ github.run_id }}
          path: |
            output/verification.json
            output/*.log
            output/provider-dependencies.json
            output/build-links.json
            output/visual/latest/**
            output/distribution/latest/**
            output/browser/**
          if-no-files-found: ignore
          retention-days: 7

  workflow-lint:
    name: Workflows are valid
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/workflow-lint.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    permissions:
      contents: read

  lockfile:
    name: Lockfile integrity
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    with:
      strict: true
    permissions:
      contents: read


  conformance:
    name: Debt classes at or below the recorded baseline
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/conformance-guard.yml@81e132e4cb94bf1a4a163fe5fe22c2da5cabbb8d
    with:
      atlas-ref: 81e132e4cb94bf1a4a163fe5fe22c2da5cabbb8d
      member: metis
    permissions:
      contents: read

  semver:
    name: Public API (informational)
    needs: changes
    if: >-
      always() &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped') &&
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      needs.changes.outputs.code == 'true'
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    with:
      package: metis,metis-core,metis-backend,metis-frontend,metis-ipc,metis-ui-lang,metis-platform,metis-web
    permissions:
      contents: read

  artifact-budget:
    name: Artifact budget
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/artifact-budget.yml@d22a9895b5967b2ccdd76668a95e6fc3851c99a7
    with:
      atlas-ref: d22a9895b5967b2ccdd76668a95e6fc3851c99a7
    permissions:
      contents: read

  gate:
    name: Metis gate
    if: always()
    needs: [changes, verify, workflow-lint, lockfile, adr-index, conformance, semver, artifact-budget, fuzz, browser-assets, browser-runtime, browser-text-cross-engine]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject draft pull requests
        # Every other job above skips on a draft PR, so an all-skipped gate
        # would otherwise report success on the draft head commit; that
        # stale green would satisfy the ruleset until ready_for_review
        # produces its own run. A draft is never merge-ready.
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        shell: bash
        run: |
          echo "::error::Draft pull requests are never merge-ready; this check stays red until ready_for_review." >&2
          exit 1
      - name: Fail if any required job failed or was cancelled
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | .key
          ')
          if [[ -n "$failed" ]]; then
            echo "failed or cancelled required jobs:" >&2
            echo "$failed" >&2
            exit 1
          fi
      - name: Create verified-tree marker
        if: github.event_name == 'pull_request' && needs.verify.result == 'success'
        shell: bash
        run: echo "${{ needs.changes.outputs.tree }}" > verified-tree.txt
      - name: Record verified tree
        # Lets the next push's `changes` job skip re-running the Windows
        # gate when the pushed commit's tree already passed it here.
        if: github.event_name == 'pull_request' && needs.verify.result == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-tree-${{ needs.changes.outputs.tree }}
          path: verified-tree.txt
          retention-days: 7

  fuzz:
    name: LibFuzzer parser campaign
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup pinned nightly Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action revision
        with:
          toolchain: nightly-2026-08-01
          targets: x86_64-unknown-linux-gnu
      - name: Assert the fuzz toolchain
        shell: bash
        run: |
          set -euo pipefail
          case "$(rustc --version)" in
            *nightly*) ;;
            *) echo 'ERROR: fuzz job requires the pinned nightly compiler' >&2; exit 1 ;;
          esac
      - name: Verify the fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-fuzz@0.13.2
          checksum: true
      - name: Run bounded parser campaign
        working-directory: fuzz
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu protocol --
          -max_total_time=300 -rss_limit_mb=2048 -timeout=25 -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  browser-assets:
    name: Build browser runtime assets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - name: Prime locked Cargo sources
        shell: bash
        run: rustup run 1.97.0 cargo fetch --locked --manifest-path Cargo.toml
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: wasm-bindgen@0.2.128
          checksum: true
      - name: Build browser assets
        shell: bash
        run: python scripts/browser.py build
      - name: Check subprocess-tree deadlines
        run: python -m unittest scripts.tests.test_process_tree
      - name: Upload browser assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-browser-assets-${{ github.run_id }}
          path: output/browser
          if-no-files-found: error
          retention-days: 7

  browser-runtime:
    name: Browser runtime (${{ matrix.engine }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: browser-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            runner: ubuntu-24.04
            driver_url: http://127.0.0.1:9515
            device_scale: '2'
          - engine: firefox
            runner: ubuntu-24.04
            driver_url: http://127.0.0.1:4444
            device_scale: '2'
          - engine: webkit
            runner: macos-latest
            driver_url: http://127.0.0.1:4444
            device_scale: '1'
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Setup Rust for HTTP boundary
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
      - name: Download browser assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metis-browser-assets-${{ github.run_id }}
          path: output/browser
      - name: Build HTTP fragment service
        shell: bash
        run: cargo build --locked -p metis-app
      - name: Start virtual display
        if: matrix.engine != 'webkit'
        shell: bash
        run: |
          set -euo pipefail
          command -v Xvfb
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - name: Start Chromium WebDriver
        if: matrix.engine == 'chromium'
        shell: bash
        run: |
          set -euo pipefail
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
      - name: Start Firefox WebDriver
        if: matrix.engine == 'firefox'
        shell: bash
        run: |
          set -euo pipefail
          "$GECKOWEBDRIVER/geckodriver" --port=4444 --host 127.0.0.1 > "$RUNNER_TEMP/geckodriver.log" 2>&1 &
      - name: Enable Safari WebDriver
        if: matrix.engine == 'webkit'
        shell: bash
        run: sudo -n /usr/bin/safaridriver --enable
      - name: Start Safari WebDriver
        if: matrix.engine == 'webkit'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
      - name: Wait for WebDriver
        shell: bash
        env:
          DRIVER_URL: ${{ matrix.driver_url }}
        run: |
          set -euo pipefail
          python - "$DRIVER_URL" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          endpoint = sys.argv[1].rstrip("/") + "/status"
          deadline = time.monotonic() + 20.0
          last_error = "no response"
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(endpoint, timeout=1.0) as response:
                      if response.status != 200:
                          last_error = f"HTTP {response.status}"
                      else:
                          document = json.load(response)
                          value = document.get("value") if isinstance(document, dict) else None
                          if isinstance(value, dict) and value.get("ready") is not False:
                              raise SystemExit(0)
                          last_error = "driver status is not ready"
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as error:
                  last_error = str(error)
              time.sleep(0.1)
          raise SystemExit(f"WebDriver did not become ready within 20 seconds: {last_error}")
          PY
      - name: Run browser lifecycle trace
        shell: bash
        env:
          DRIVER_URL: ${{ matrix.driver_url }}
          ENGINE: ${{ matrix.engine }}
          DEVICE_SCALE: ${{ matrix.device_scale }}
        run: |
          set -euo pipefail
          python scripts/browser_runtime.py \
            --engine "$ENGINE" \
            --driver-url "$DRIVER_URL" \
            --serve-dir output/browser \
            --bridge disconnected \
            --device-scale "$DEVICE_SCALE" \
            --browser-heap-sample \
            --accessibility-probe \
            --asset-probe \
            --text-geometry-probe \
            --lifecycle-cycles 4 \
            --timeout-seconds 60 \
            --output "output/browser/runtime/$ENGINE-workbench.json"
      - name: Run authenticated fragment trace
        shell: bash
        env:
          DRIVER_URL: ${{ matrix.driver_url }}
          ENGINE: ${{ matrix.engine }}
          DEVICE_SCALE: ${{ matrix.device_scale }}
        run: |
          set -euo pipefail
          static_port_file="$RUNNER_TEMP/metis-http-port"
          rm -f "$static_port_file"
          python scripts/browser_static_server.py \
            --directory output/browser \
            --port-file "$static_port_file" \
            > "$RUNNER_TEMP/metis-http-static.log" 2>&1 &
          static_pid=$!
          service_pid=''
          cleanup() {
            status=$?
            if [[ -n "$service_pid" ]]; then
              kill "$service_pid" 2>/dev/null || true
              wait "$service_pid" 2>/dev/null || true
            fi
            kill "$static_pid" 2>/dev/null || true
            wait "$static_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          for _ in {1..200}; do
            if [[ -s "$static_port_file" ]]; then
              break
            fi
            if ! kill -0 "$static_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/metis-http-static.log"
              exit 1
            fi
            sleep 0.1
          done
          if [[ ! -s "$static_port_file" ]]; then
            echo 'HTTP static server did not publish a port within 20 seconds' >&2
            exit 1
          fi
          static_port="$(cat "$static_port_file")"
          origin="http://127.0.0.1:$static_port"
          target_binary="$(pwd)/target/debug/metis-app"
          "$target_binary" --metis-http-service "$origin" 8766 66666666666666666666666666666666 > "$RUNNER_TEMP/metis-http-service.log" 2>&1 &
          service_pid=$!
          python - "$service_pid" "$origin" <<'PY'
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          pid = int(sys.argv[1])
          origin = sys.argv[2]
          endpoint = "http://127.0.0.1:8766/health"
          deadline = time.monotonic() + 20.0
          last_error = "no response"
          while time.monotonic() < deadline:
              try:
                  os.kill(pid, 0)
              except OSError as error:
                  raise SystemExit(f"HTTP fragment service exited before readiness: {error}") from error
              try:
                  request = urllib.request.Request(endpoint, headers={"Origin": origin})
                  with urllib.request.urlopen(request, timeout=1.0) as response:
                      body = response.read().decode("utf-8")
                      if response.status == 200 and body == "metis-http-ready\n":
                          raise SystemExit(0)
                      last_error = f"HTTP {response.status}: {body!r}"
              except (OSError, urllib.error.URLError, UnicodeError) as error:
                  last_error = str(error)
              time.sleep(0.1)
          raise SystemExit(f"HTTP fragment service did not become ready within 20 seconds: {last_error}")
          PY
          python scripts/browser_runtime.py \
            --engine "$ENGINE" \
            --driver-url "$DRIVER_URL" \
            --scenario fragment \
            --url "$origin/http-health.html" \
            --device-scale "$DEVICE_SCALE" \
            --browser-heap-sample \
            --timeout-seconds 60 \
            --output "output/browser/runtime/$ENGINE-fragment.json"
      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-browser-runtime-${{ matrix.engine }}-${{ github.run_id }}
          path: output/browser/runtime
          if-no-files-found: ignore
          retention-days: 7

  browser-text-cross-engine:
    name: Cross-engine text geometry
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: browser-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download browser runtime traces
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: metis-browser-runtime-*-${{ github.run_id }}
          merge-multiple: true
          path: output/browser/runtime
      - name: Compare semantic text geometry
        run: |
          set -euo pipefail
          python scripts/browser_text_cross_engine.py \
            --trace chromium=output/browser/runtime/chromium-workbench.json \
            --trace firefox=output/browser/runtime/firefox-workbench.json \
            --trace webkit=output/browser/runtime/webkit-workbench.json \
            --output output/browser/runtime/text-cross-engine.json
      - name: Upload cross-engine text evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-browser-text-cross-engine-${{ github.run_id }}
          path: output/browser/runtime/text-cross-engine.json
          if-no-files-found: error
          retention-days: 7
