name: Metis verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.config/**'
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - 'scripts/**'
      - 'metis.json'
      - 'backlog.md'
      - '.github/workflows/**'
  merge_group:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [feat/process-foundation]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.config/**'
      - 'crates/**'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'docs/**'
      - 'scripts/**'
      - 'metis.json'
      - 'backlog.md'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: metis-verification-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Windows gate
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Python binding gate tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "maturin==1.14.1" "pytest==8.4.2"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Prime locked Cargo sources
        shell: pwsh
        run: rustup run 1.97.0 cargo fetch --locked --manifest-path Cargo.toml
      - name: Install pinned gate tools
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: |
            cargo-nextest@0.9.143
            cargo-deny@0.20.2
            wasm-bindgen@0.2.128
          checksum: true
      - name: Prime advisory database
        shell: pwsh
        run: cargo-deny fetch db
      - name: Run the committed Metis gate
        shell: pwsh
        run: python scripts/verify.py
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-verification-${{ github.run_id }}
          path: |
            output/verification.json
            output/*.log
            output/provider-dependencies.json
            output/build-links.json
            output/visual/latest/**
            output/distribution/latest/**
            output/browser/**
          if-no-files-found: ignore
          retention-days: 7

  workflow-lint:
    name: Workflows are valid
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/workflow-lint.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    permissions:
      contents: read

  lockfile:
    name: Lockfile integrity
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    permissions:
      contents: read

  adr-index:
    name: ADR index is current
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/adr-index-guard.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    with:
      strict: true
    permissions:
      contents: read

  semver:
    name: Public API (informational)
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@848e6649c52e8226a9abf7bc336f8cbf0e39ba08
    with:
      package: metis,metis-core,metis-backend,metis-frontend,metis-ipc,metis-ui-lang,metis-platform,metis-web
    permissions:
      contents: read

  fuzz:
    name: LibFuzzer parser campaign
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Setup pinned nightly Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # pinned action revision
        with:
          toolchain: nightly-2026-08-01
          targets: x86_64-unknown-linux-gnu
      - name: Assert the fuzz toolchain
        shell: bash
        run: |
          set -euo pipefail
          case "$(rustc --version)" in
            *nightly*) ;;
            *) echo 'ERROR: fuzz job requires the pinned nightly compiler' >&2; exit 1 ;;
          esac
      - name: Verify the fuzz lockfile
        working-directory: fuzz
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-fuzz@0.13.2
          checksum: true
      - name: Run bounded parser campaign
        working-directory: fuzz
        run: >-
          cargo fuzz run --target x86_64-unknown-linux-gnu protocol --
          -max_total_time=300 -rss_limit_mb=2048 -timeout=25 -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

  browser-assets:
    name: Build browser runtime assets
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - name: Prime locked Cargo sources
        shell: bash
        run: rustup run 1.97.0 cargo fetch --locked --manifest-path Cargo.toml
      - name: Install wasm-bindgen
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: wasm-bindgen@0.2.128
          checksum: true
      - name: Build browser assets
        shell: bash
        run: python scripts/browser.py build
      - name: Upload browser assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-browser-assets-${{ github.run_id }}
          path: output/browser
          if-no-files-found: error
          retention-days: 7

  browser-runtime:
    name: Browser runtime (${{ matrix.engine }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: browser-assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            runner: ubuntu-24.04
            driver_url: http://127.0.0.1:9515
          - engine: firefox
            runner: ubuntu-24.04
            driver_url: http://127.0.0.1:4444
          - engine: webkit
            runner: macos-latest
            driver_url: http://127.0.0.1:4444
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Download browser assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: metis-browser-assets-${{ github.run_id }}
          path: output/browser
      - name: Start virtual display
        if: matrix.engine != 'webkit'
        shell: bash
        run: |
          set -euo pipefail
          command -v Xvfb
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - name: Start Chromium WebDriver
        if: matrix.engine == 'chromium'
        shell: bash
        run: |
          set -euo pipefail
          "$CHROMEWEBDRIVER/chromedriver" --port=9515 > "$RUNNER_TEMP/chromedriver.log" 2>&1 &
      - name: Start Firefox WebDriver
        if: matrix.engine == 'firefox'
        shell: bash
        run: |
          set -euo pipefail
          "$GECKOWEBDRIVER/geckodriver" --port=4444 --host 127.0.0.1 > "$RUNNER_TEMP/geckodriver.log" 2>&1 &
      - name: Enable Safari WebDriver
        if: matrix.engine == 'webkit'
        shell: bash
        run: sudo -n /usr/bin/safaridriver --enable
      - name: Start Safari WebDriver
        if: matrix.engine == 'webkit'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/safaridriver -p 4444 > "$RUNNER_TEMP/safaridriver.log" 2>&1 &
      - name: Wait for WebDriver
        shell: bash
        env:
          DRIVER_URL: ${{ matrix.driver_url }}
        run: |
          set -euo pipefail
          python - "$DRIVER_URL" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          endpoint = sys.argv[1].rstrip("/") + "/status"
          deadline = time.monotonic() + 20.0
          last_error = "no response"
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(endpoint, timeout=1.0) as response:
                      if response.status != 200:
                          last_error = f"HTTP {response.status}"
                      else:
                          document = json.load(response)
                          value = document.get("value") if isinstance(document, dict) else None
                          if isinstance(value, dict) and value.get("ready") is not False:
                              raise SystemExit(0)
                          last_error = "driver status is not ready"
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as error:
                  last_error = str(error)
              time.sleep(0.1)
          raise SystemExit(f"WebDriver did not become ready within 20 seconds: {last_error}")
          PY
      - name: Run browser lifecycle trace
        shell: bash
        env:
          DRIVER_URL: ${{ matrix.driver_url }}
          ENGINE: ${{ matrix.engine }}
        run: |
          set -euo pipefail
          python scripts/browser_runtime.py \
            --engine "$ENGINE" \
            --driver-url "$DRIVER_URL" \
            --serve-dir output/browser \
            --bridge disconnected \
            --browser-heap-sample \
            --lifecycle-cycles 4 \
            --timeout-seconds 60 \
            --output "output/browser/runtime/$ENGINE-workbench.json"
      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metis-browser-runtime-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            output/browser/runtime/**
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7
