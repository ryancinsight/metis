name: Crates.io Release

# Metis delegates packaging and publication to the Atlas reusable workflow.
# The publish job receives a short-lived OIDC token; this caller has no
# registry secret and never uses a developer signing key.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to validate without publishing
        required: true
        type: string
      version:
        description: Exact Cargo package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-release-${{ github.event.release.tag_name || inputs.package }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # The release tag names one package. Parse it once so the semver gate checks
  # the same package that Atlas will validate and publish.
  identify:
    name: Resolve release identity
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse the release tag
        id: parse
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ "$RELEASE_TAG" =~ ^crate-(.+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
              package="${BASH_REMATCH[1]}"
              version="${BASH_REMATCH[2]}"
            else
              echo "release tag must be crate-<package>-v<version>" >&2
              exit 1
            fi
          else
            package="$INPUT_PACKAGE"
            version="$INPUT_VERSION"
          fi
          case "$package" in
            metis|metis-backend|metis-core|metis-frontend|metis-ipc|metis-platform|metis-ui-lang|metis-app|metis-web|metis-python) ;;
            *)
              echo "unknown publishable package for this repository: $package" >&2
              exit 1
              ;;
          esac
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  semver:
    name: SemVer gate (release)
    needs: identify
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@c73c3dabe9573f09df7f1e2eacfccac17f685c6c
    with:
      release-gate: true
      package: ${{ needs.identify.outputs.package }}
      rust-toolchain: "1.97.0"
    permissions:
      contents: read

  publish:
    needs: [identify, semver]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'crate-')
    uses: ryancinsight/atlas/.github/workflows/crates-publish.yml@c73c3dabe9573f09df7f1e2eacfccac17f685c6c
    permissions:
      contents: read
      id-token: write
    with:
      rust-toolchain: "1.97.0"
      tag-prefix: "crate-"
      dispatch-package: ${{ inputs.package }}
      dispatch-version: ${{ inputs.version }}
