[package]
name = "metis-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
metis-core = { path = "../crates/metis-core" }
metis-ipc = { path = "../crates/metis-ipc" }
metis-platform = { path = "../crates/metis-platform" }
metis-ui-lang = { path = "../crates/metis-ui-lang" }

# The fuzz harness is kept out of the normal workspace so libFuzzer's native
# runtime never enters application builds or the release dependency graph.
[workspace]

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_patch_set"
path = "fuzz_targets/fragment_patch_set.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fragment_action"
path = "fuzz_targets/fragment_action.rs"
test = false
doc = false
bench = false

[[bin]]
name = "deep_link"
path = "fuzz_targets/deep_link.rs"
test = false
doc = false
bench = false

[[bin]]
