[package]
name = "metis-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Privileged clinical logic, safety interlocks, capability authorization, audit ledger, and supervisor for Metis"

[dependencies]
moirai-core.workspace = true
moirai-crypto.workspace = true
moirai-executor.workspace = true
moirai-transport.workspace = true
metis-core = { workspace = true }
metis-ipc = { workspace = true }
metis-platform = { workspace = true }

# Off by default: forward the platform feature that carries the Windows
# clipboard mechanism until a Moirai release carries it upstream (see the
# METIS-INTEGRATION-001 clipboard increment).
[features]
clipboard = ["metis-platform/clipboard"]
default = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moirai-async.workspace = true
moirai-http.workspace = true
moirai-quic.workspace = true

[dev-dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true

[lib]
name = "metis_backend"
path = "src/lib.rs"

[lints]
workspace = true

[[example]]
name = "quic_session"
