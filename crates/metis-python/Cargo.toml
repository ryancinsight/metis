[package]
name = "metis-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin PyO3 bindings for the Metis Rust application framework"
readme = "README.md"

[lib]
name = "_metis"
crate-type = ["cdylib"]
test = false
doc = false

[features]
default = ["abi3"]
abi3 = ["pyo3/extension-module", "pyo3/abi3-py39"]
abi3t = ["pyo3/extension-module", "pyo3/abi3t-py315"]

[dependencies]
metis-backend.workspace = true
metis-core.workspace = true
metis-platform.workspace = true
metis-ui-lang.workspace = true
pyo3.workspace = true

[lints]
workspace = true
