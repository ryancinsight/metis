[package]
name = "metis-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Length-prefixed binary IPC transport, channel abstractions, framing, and fault injection for Metis"

[dependencies]
metis-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
moirai-async.workspace = true
moirai-http.workspace = true
moirai-quic = { workspace = true, optional = true }
moirai-executor = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
moirai-pal.workspace = true

[lints]
workspace = true

[features]
quic = ["dep:moirai-quic", "dep:moirai-executor"]
